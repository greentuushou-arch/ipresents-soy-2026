<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>アイプレゼンツ SOY2026 投票バナー</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ?sp を付けるとスマホ用（750×500）、なしでPC用（1200×400） */
:root{--coral:#ef6f6c;--coral-d:#d9534f;--honey:#efcd4f;--honey-l:#fbf0c4;--blush:#fdebe8;--cream:#fffaf3;--ink:#3b3331}
@page{margin:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--cream)}
body{font-family:"Zen Maru Gothic",sans-serif;color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bn{position:relative;overflow:hidden;background:linear-gradient(120deg,var(--blush) 0%,var(--cream) 55%,var(--honey-l) 100%)}
.bn::before{content:"";position:absolute;inset:12px;border:2px dashed rgba(239,111,108,.35);border-radius:22px;pointer-events:none}
.heart{position:absolute;width:var(--s);height:var(--s);background:var(--c);-webkit-mask:var(--hm) center/contain no-repeat;mask:var(--hm) center/contain no-repeat;opacity:.55}
.logo img{width:100%;display:block}
.ribbon{display:inline-block;background:var(--coral);color:#fff;font-family:"Quicksand",sans-serif;font-weight:700;letter-spacing:.14em;clip-path:polygon(0 0,100% 0,96% 50%,100% 100%,0 100%,4% 50%)}
.ttl{font-weight:900;color:var(--coral);white-space:nowrap;letter-spacing:.04em;line-height:1.1}
.pt{display:inline-flex;align-items:baseline;gap:.5em;background:#fff;border:2px solid var(--honey);border-radius:999px;font-weight:900;white-space:nowrap;line-height:1.2}
.pt .n{font-family:"Quicksand",sans-serif;font-weight:700;color:var(--coral);font-size:1.45em}
.pt .n small{font-family:"Zen Maru Gothic",sans-serif;font-size:.62em}
.pt .s{font-weight:700}
.pt .s b{font-family:"Quicksand",sans-serif;color:var(--coral);font-size:1.2em}
.meta{display:flex;align-items:center;gap:18px;white-space:nowrap}
.dl{font-weight:700}
.dl b{font-family:"Quicksand",sans-serif;font-size:1.35em;color:var(--coral-d)}
.cta{display:inline-flex;align-items:center;gap:10px;background:var(--coral);color:#fff;border-radius:999px;font-weight:700;letter-spacing:.08em;box-shadow:0 4px 0 var(--coral-d)}
.cta i{display:grid;place-items:center;border-radius:50%;background:#fff;color:var(--coral);font-style:normal;font-size:.7em}
.note{font-size:13px;color:#8a7e7a}

/* ---------- PC 1200×400 ---------- */
.pc{width:1200px;height:400px;display:grid;grid-template-columns:330px 1fr;align-items:center;padding:0 50px 0 40px}
.pc .logo{width:300px}
.pc .r{padding-left:20px}
.pc .ribbon{font-size:22px;padding:8px 40px}
.pc .ttl{font-size:104px;margin-top:10px}
.pc .pt{font-size:28px;padding:8px 26px 10px;margin-top:12px}
.pc .meta{margin-top:16px}
.pc .dl{font-size:20px}
.pc .cta{font-size:22px;padding:10px 16px 10px 28px}
.pc .cta i{width:30px;height:30px}

/* ---------- SP 750×500 ---------- */
.sp{width:750px;height:500px;padding:56px 40px 0;text-align:center}
.sp .ribbon{font-size:22px;padding:8px 40px}
.sp .row{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:14px}
.sp .logo{width:130px;flex:none}
.sp .ttl{font-size:82px}
.sp .pt{font-size:24px;padding:8px 24px 10px;margin-top:16px}
.sp .meta{justify-content:center;margin-top:22px}
.sp .dl{font-size:20px}
.sp .cta{font-size:22px;padding:10px 16px 10px 28px}
.sp .cta i{width:30px;height:30px}
</style>
</head>
<body>
<div class="bn" id="bn">
  <div class="logo"><img src="../images/logo.png" alt="アイプレゼンツ"></div>
  <div class="r">
    <p class="ribbon">RAKUTEN SHOP OF THE YEAR 2026</p>
    <p class="ttl">投票受付中！</p>
    <p class="pt"><span class="n">最大10,000<small>ポイント</small>！</span><span class="s">合計<b>10</b>万名様に当たる！</span></p>
    <div class="meta"><p class="dl">投票は<b>11.30</b>(月)09:59まで</p><span class="cta">投票はこちら<i>▶</i></span></div>
  </div>
</div>
<script>
(function(){
  var sp = location.search.indexOf('sp') > -1, bn = document.getElementById('bn');
  var W = sp ? 750 : 1200, H = sp ? 500 : 400;
  bn.classList.add(sp ? 'sp' : 'pc');
  // 印刷（PDF）のページサイズをバナーの大きさに合わせる
  var st = document.createElement('style');
  st.textContent = '@page{size:' + W + 'px ' + H + 'px;margin:0}';
  document.head.appendChild(st);
  if (sp) {
    // スマホ用はロゴを見出しの横に並べる
    var r = bn.querySelector('.r'), logo = bn.querySelector('.logo'), ttl = r.querySelector('.ttl');
    var row = document.createElement('div'); row.className = 'row';
    r.insertBefore(row, ttl); row.appendChild(logo); row.appendChild(ttl);
  }
  // 背景にうすいハートを散らす
  var HM = 'url("data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.2 0 3.6 1.3 5.3 3.2 1.7-1.9 3.1-3.2 5.3-3.2 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>') + '")';
  var C = ['#f6a9bd', '#ef6f6c', '#efcd4f', '#78b98a'];
  var spots = sp ? [[4,8],[90,10],[95,62],[6,70],[60,88],[30,92]] : [[52,10],[94,14],[97,70],[40,88],[75,90],[30,8]];
  spots.forEach(function(p, i){
    var h = document.createElement('span'); h.className = 'heart';
    h.style.cssText = 'left:' + p[0] + '%;top:' + p[1] + '%;--s:' + (16 + (i % 3) * 8) + 'px;--c:' + C[i % C.length] + ';--hm:' + HM;
    bn.insertBefore(h, bn.firstChild);
  });
})();
</script>
</body>
</html>
